name: Deploy to GitHub Pages

# main 에 푸시하면 자동으로 빌드해서 Pages 에 올린다.
# 저장소 Settings > Pages > Source 를 "GitHub Actions" 로 한 번만 바꿔주면 된다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않게 한 번에 하나만
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # vite.config.js 의 base 가 './' 라서 /DSHS-3D-Map/ 같은 하위 경로에서도
      # 자산 경로가 깨지지 않는다.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
